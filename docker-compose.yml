services:
  mongo:
    image: mongo:7
    container_name: devopslabka-mongo
    restart: unless-stopped
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    image: devopslabka-backend:local
    container_name: devopslabka-backend
    restart: unless-stopped
    environment:
      MONGODB_URI: mongodb://mongo:27017/websecurity26
      JWT_SECRET: ${JWT_SECRET:-web-security26-jwt-secret-key-for-hs384-signing-2026}
    ports: ["8081:8080"]
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build: ./frontend
    image: devopslabka-frontend:local
    container_name: devopslabka-frontend
    restart: unless-stopped
    ports: ["3000:8080"]
    depends_on: [backend]

volumes:
  mongo-data:
