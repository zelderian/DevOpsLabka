spring.application.name=web-security26

spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/websecurity26}
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/websecurity26}

app.csrf.enabled=${APP_CSRF_ENABLED:true}

app.jwt.secret=${JWT_SECRET:web-security26-jwt-secret-key-for-hs384-signing-2026}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

app.version=${APP_VERSION:dev}
