apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devopslabka
  namespace: devopslabka
  labels:
    app.kubernetes.io/part-of: devopslabka
spec:
  ingressClassName: nginx
  rules:
    - host: devopslabka.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
