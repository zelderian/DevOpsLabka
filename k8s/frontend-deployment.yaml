apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: devopslabka
  labels:
    app: frontend
    app.kubernetes.io/part-of: devopslabka
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: frontend
        app.kubernetes.io/part-of: devopslabka
    spec:
      containers:
        - name: frontend
          image: ghcr.io/zelderian/devopslabka-frontend:1.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: BACKEND_URL
              value: http://backend:8080
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          readinessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
