apiVersion: v1
kind: Service
metadata:
  name: {{ include "devopslabka.fullname" . }}-mongo
  labels:
    {{- include "devopslabka.labels" . | nindent 4 }}
    app.kubernetes.io/component: mongo
spec:
  type: ClusterIP
  selector:
    {{- include "devopslabka.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: mongo
  ports:
    - name: mongo
      port: 27017
      targetPort: mongo
