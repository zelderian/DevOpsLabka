{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "devopslabka.secretName" . }}
  labels:
    {{- include "devopslabka.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
type: Opaque
stringData:
  MONGODB_URI: {{ .Values.secrets.mongodbUri | default (printf "mongodb://%s-mongo:27017/websecurity26" (include "devopslabka.fullname" .)) | quote }}
  JWT_SECRET: {{ required "secrets.jwtSecret is required (or set existingSecret)" .Values.secrets.jwtSecret | quote }}
{{- end }}
