name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend (build, lint, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25 (with Maven dependency cache)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Build
        run: mvn -B -ntp compile

      - name: Lint (Checkstyle)
        run: |
          echo "::add-matcher::${GITHUB_WORKSPACE}/.github/checkstyle-problem-matcher.json"
          mvn -B -ntp checkstyle:check

      - name: Test
        run: mvn -B -ntp test

      - name: Package jar
        run: mvn -B -ntp package -DskipTests

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

  frontend:
    name: frontend (build, lint, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 22 (with npm cache)
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  k8s:
    name: k8s (manifests, helm lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin kubeconform

      - name: Validate k8s/ manifests
        run: kubeconform -strict -summary k8s/

      - name: Helm lint (default, dev, prod)
        run: |
          helm lint charts/devopslabka
          helm lint charts/devopslabka -f charts/devopslabka/values-dev.yaml
          helm lint charts/devopslabka -f charts/devopslabka/values-prod.yaml

      - name: Validate rendered chart
        run: |
          for f in values.yaml values-dev.yaml values-prod.yaml; do
            helm template devopslabka charts/devopslabka -f charts/devopslabka/$f | kubeconform -strict -summary
          done

  docker:
    name: docker (${{ matrix.service }})
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v7

      - name: Image name (ghcr.io requires lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/devopslabka-${{ matrix.service }}" >> "$GITHUB_ENV"

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=run-${{ github.run_number }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - uses: docker/setup-buildx-action@v4

      - name: Build image (local, no push)
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service }}
          load: true
          push: false
          tags: ${{ env.IMAGE }}:ci
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ env.IMAGE }}:ci
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.service }}
